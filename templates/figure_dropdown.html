<span
    class="hstack"
    style="gap: var(--space-2); align-items: center; flex-wrap: nowrap"
>
    <select
        aria-label="Select a group"
        style="flex-shrink: 1; max-width: 12rem; font-size: 14px"
    >
        <option value="" disabled selected>Select</option>
        {% for group in groups %}
        <option>{{ group }}</option>
        {% endfor %}
    </select>
    <figure data-variant="avatar" aria-label="Avatar" style="flex-shrink: 0">
        <img src="{{groups[0] | owner_icon_url }}" alt="{{ groups[0] }}" />
    </figure>
</span>
